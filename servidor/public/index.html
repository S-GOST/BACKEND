<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Precios</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="pricing-shell">
      <div class="pricing-table" role="table" aria-label="Tabla de precios">
        <div class="pricing-row pricing-header" role="row">
          <div class="pricing-cell pricing-spacer" role="columnheader"></div>
          <div class="pricing-cell" role="columnheader">Precio de costo</div>
          <div class="pricing-cell" role="columnheader">Precio de venta</div>
        </div>

        <div class="pricing-row" role="row">
          <div class="pricing-cell pricing-label" role="cell">Motos</div>
          <div class="pricing-cell price" role="cell">$80.000</div>
          <div class="pricing-cell price" role="cell">$120.000</div>
        </div>

        <div class="pricing-row" role="row">
          <div class="pricing-cell pricing-label" role="cell">Accesorios</div>
          <div class="pricing-cell price" role="cell">$120.000</div>
          <div class="pricing-cell price" role="cell">$180.000</div>
        </div>

        <div class="pricing-row" role="row">
          <div class="pricing-cell pricing-label" role="cell">Repuestos</div>
          <div class="pricing-cell price" role="cell">$100.000</div>
          <div class="pricing-cell price" role="cell">$150.000</div>
        </div>

        <div class="pricing-row pricing-highlight" role="row">
          <div class="pricing-cell pricing-label" role="cell">ROCKET</div>
          <div class="pricing-cell price" role="cell">$0</div>
          <div class="pricing-cell price" role="cell">$400.000</div>
        </div>
      </div>
    </main>
  </body>
</html>
